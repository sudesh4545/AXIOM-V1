[pytest]
# `asyncio_mode = auto` matlab har async test function automatically async test
# ke roop mein chalta hai — har test pe `@pytest.mark.asyncio` likhne ki
# zaroorat nahi. Ek bhoola hua marker warna test ko silently skip kar deta hai,
# aur woh khatarnak hai (green suite jo actually kuch test nahi kar rahi).
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers --strict-config

# `pythonpath = .` se `apps/api` sys.path pe aa jaata hai, isliye
# `from app.main import app` kaam karta hai bina package install kiye ya
# PYTHONPATH manually set kiye. Iske bina pytest sirf `tests/` folder ko
# sys.path pe daalta hai aur `app` import fail ho jaata hai.
pythonpath = .
