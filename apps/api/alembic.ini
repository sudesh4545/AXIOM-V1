# Alembic configuration for AXIOM API.
#
# `sqlalchemy.url` yahan deliberately khaali hai. Woh runtime pe
# `AXIOM_DATABASE_URL` se aati hai (dekhein alembic/env.py). Connection string
# ko yahan likhna matlab credentials ko git mein commit karna.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Migration filenames date-prefixed rakhte hain taaki order dekhne se hi samajh
# aaye. Random hashes wali list mein order pata hi nahi chalta.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
