name: Build AXIOM mobile apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk AXIOM-V1-Android-0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AXIOM-V1-Android
          path: apps/mobile/AXIOM-V1-Android-0.1.0.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx cap sync ios
      - name: Build unsigned iOS simulator app
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -sdk iphonesimulator -configuration Debug
          -derivedDataPath ios/DerivedData
          CODE_SIGNING_ALLOWED=NO build
      - name: Package iOS outputs
        run: |
          ditto -c -k --sequesterRsrc --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app AXIOM-V1-iOS-Simulator-0.1.0.zip
          ditto -c -k --sequesterRsrc --keepParent ios AXIOM-V1-iOS-Xcode-0.1.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AXIOM-V1-iOS
          path: |
            apps/mobile/AXIOM-V1-iOS-Simulator-0.1.0.zip
            apps/mobile/AXIOM-V1-iOS-Xcode-0.1.0.zip

  release:
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
